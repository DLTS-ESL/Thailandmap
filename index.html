<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thailand Geography Explorer</title>

<!-- Leaflet -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIINfQ3FJ1zj4pQqF4Xw8JQp8lJv+f8X5gE="
  crossorigin=""
/>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  font-family:
    "Noto Sans Thai",
    "Noto Sans",
    Arial,
    sans-serif;
  background: #eef6fb;
}

#app {
  width: 100%;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* =========================
   HEADER
========================= */

.header {
  height: 72px;
  background: #ffffff;
  border-bottom: 1px solid #dbe7ef;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 10px 18px;
  z-index: 2000;
  position: relative;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 240px;
}

.logo-icon {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: #e7f5ff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
}

.logo-text {
  line-height: 1.05;
}

.logo-title {
  font-size: 18px;
  font-weight: 800;
  color: #175b83;
}

.logo-subtitle {
  font-size: 11px;
  color: #78909c;
  margin-top: 4px;
}

/* SEARCH */

.search-area {
  flex: 1;
  max-width: 650px;
  position: relative;
}

.search-box {
  width: 100%;
  height: 46px;
  border: 1px solid #cbdce7;
  border-radius: 13px;
  background: #f8fcff;
  padding: 0 48px 0 45px;
  font-size: 15px;
  outline: none;
  transition: 0.2s;
}

.search-box:focus {
  border-color: #239bd3;
  background: #fff;
  box-shadow: 0 0 0 3px rgba(35,155,211,0.12);
}

.search-icon {
  position: absolute;
  left: 15px;
  top: 13px;
  font-size: 19px;
  color: #6d8795;
  pointer-events: none;
}

.clear-search {
  position: absolute;
  right: 13px;
  top: 9px;
  width: 28px;
  height: 28px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: #78909c;
  font-size: 18px;
  cursor: pointer;
  display: none;
}

.clear-search:hover {
  background: #e9f2f7;
}

/* LANGUAGE */

.lang-buttons {
  display: flex;
  gap: 5px;
}

.lang-button {
  border: 1px solid #d4e1e8;
  background: white;
  border-radius: 8px;
  padding: 7px 10px;
  cursor: pointer;
  font-weight: 700;
  font-size: 12px;
  color: #58717e;
}

.lang-button.active {
  background: #e5f5ff;
  color: #0874aa;
  border-color: #8ed1f1;
}

/* =========================
   MAIN
========================= */

.main {
  flex: 1;
  position: relative;
  min-height: 0;
}

#map {
  width: 100%;
  height: 100%;
}

/* =========================
   SIDE PANEL
========================= */

.panel {
  position: absolute;
  top: 15px;
  left: 15px;
  width: 345px;
  max-height: calc(100% - 30px);
  background: rgba(255,255,255,0.97);
  border: 1px solid #d9e6ed;
  border-radius: 16px;
  z-index: 1200;
